[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3C00430006504E5238363120-if00
restart_method: command


[printer]
kinematics: cartesian

max_velocity: 300
max_accel: 3000

max_z_velocity: 5
max_z_accel: 100


#####################################################################
# X
#####################################################################

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14

microsteps: 16
rotation_distance: 40

endstop_pin: ^PC0

position_endstop: -9
position_min: -9
position_max: 245

homing_speed: 130 #50


[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0

run_current: 0.580
stealthchop_threshold: 999999


#####################################################################
# Y
#####################################################################

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11

microsteps: 16
rotation_distance: 40

endstop_pin: ^PC1

position_endstop: 6
#position_min: 12
position_max: 236

homing_speed: 130 #50


[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2

run_current: 0.580
stealthchop_threshold: 999999


#####################################################################
# Z
#####################################################################

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1

microsteps: 16
rotation_distance: 8

endstop_pin: probe:z_virtual_endstop

position_min: -7
position_max: 250

homing_speed: 12 #5
second_homing_speed: 2

homing_retract_dist: 3


[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1

run_current: 0.580
stealthchop_threshold: 999999

#####################################################################
# Extruder
#####################################################################

[extruder]

step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1

microsteps: 16
rotation_distance: 22.11  #33.500

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: PC8

sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0

#control: pid

# Starting values.
# PID tune your actual hotend.
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982

min_temp: 0
max_temp: 295

min_extrude_temp: 170
max_extrude_only_distance: 100.0
max_extrude_cross_section: 5.0

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3

run_current: 0.650
stealthchop_threshold: 999999


#####################################################################
# Heated Bed
#####################################################################

[heater_bed]

heater_pin: PC9

sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4

#control: pid

# Starting values.
# PID tune your actual bed.
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182

min_temp: 0
max_temp: 130


#####################################################################
# Part Cooling Fan Fan1
#####################################################################

[fan]
pin: PC6

#####################################################################
# Hotend Cooling Fan0 Runs when extruder is active/hot
#####################################################################

[heater_fan hotend_fan]
pin: PC7
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

#####################################################################
# Hotend Cooling Fan0 Always on
#####################################################################

#[fan_generic hotend_fan]
#pin: PC7  # Use PB15 if wired to FAN2
#max_power: 1.0
#shutdown_speed: 0.0
#cycle_time: 0.010
#hardware_pwm: false
#kick_start_time: 0.100   


#####################################################################
# Electronic Enclosure Fan
#####################################################################

#[controller_fan electronic_enclosure_fan]
#pin: PC15
#idle_timeout: 60
#fan_speed: 1.0

#####################################################################
# Pause / Resume
#####################################################################

[pause_resume]

[display_status]

#####################################################################
# BLTouch Smart V3.1
#####################################################################

[bltouch]
sensor_pin: ^PC14
control_pin: PA1

# These are STARTING VALUES ONLY.
# Measure your actual probe position.
#x_offset: 0
x_offset: -42
#y_offset: -57
y_offset: 0
#z_offset: 3.075
speed: 8 #5
lift_speed: 10

probe_with_touch_mode: True
pin_up_touch_mode_reports_triggered: False

samples: 2
sample_retract_dist: 3.0


#####################################################################
# Safe Z Home
#####################################################################

[safe_z_home]
home_xy_position: 159.5, 117.5

speed: 130

z_hop: 10
z_hop_speed: 12


#####################################################################
# Bed Mesh
#####################################################################

[bed_mesh]
speed: 100

horizontal_move_z: 5

mesh_min:    0,12
mesh_max:    203,234
mesh_pps:    2,2
fade_start:  1
fade_end:    10
fade_target: 0

probe_count: 5, 5
algorithm: bicubic


# All customizations are documented in globals.cfg. Just copy a variable from
# there into the section below, and change the value to meet your needs.

[gcode_macro _km_options]
# These are examples of some likely customizations:
# Any sheets in the below list will be available with a configurable offset.
#variable_bed_surfaces: ['smooth_1','texture_1']
# Length (in mm) of filament to load (bowden tubes will be longer).
variable_load_length: 40.0
# Hide the Octoprint LCD menu since I don't use it.
#variable_menu_show_octoprint: False
# Customize the filament menus (up to 10 entries).
variable_menu_temperature: [
  {'name' : 'PLA',  'extruder' : 200.0, 'bed' : 60.0},
  {'name' : 'PETG', 'extruder' : 230.0, 'bed' : 8.0},
  {'name' : 'ABS',  'extruder' : 245.0, 'bed' : 105.0, 'chamber' : 60}]
# Length of filament (in millimeters) to purge at print start.
#variable_start_purge_length: 30 # This value works for most setups.
variable_start_purge_length: 30 # Length of filament to purge
variable_start_purge_clearance: 5.0 # Distance between purge and print
gcode: # This line is required by Klipper.
# Any code you put here will run at klipper startup, after the initialization
# for these macros. For example, you could uncomment the following line to
# automatically adjust your bed surface offsets to account for any changes made
# to your Z endstop or probe offset.
#  ADJUST_SURFACE_OFFSETS

# This line includes all the standard macros.
[include klipper-macros/*.cfg]
# Uncomment to include features that require specific hardware support.
# LCD menu support for features like bed surface selection and pause next layer.
#[include klipper-macros/optional/lcd_menus.cfg]
# Optimized bed leveling
#[include klipper-macros/optional/bed_mesh.cfg]

# The sections below here are required for the macros to work. If your config
# already has some of these sections you should merge the duplicates into one
# (or if they are identical just remove one of them).
[idle_timeout]
gcode:
  _KM_IDLE_TIMEOUT # This line must be in your idle_timeout section.

[pause_resume]

[respond]

[save_variables]
filename: ~/printer_data/variables.cfg # UPDATE THIS FOR YOUR PATH!!!

[virtual_sdcard]
path: ~/printer_data/gcodes # UPDATE THIS FOR YOUR PATH!!!
on_error_gcode: CANCEL_PRINT

[display_status]


[screws_tilt_adjust]
screw1: 65, 43
screw1_name: front left screw
screw2: 235, 43
screw2_name: front right screw
screw3: 234, 213
screw3_name: rear right screw
screw4: 65, 213
screw4_name: rear left screw
horizontal_move_z: 10
speed: 50
screw_thread: CW-M4

