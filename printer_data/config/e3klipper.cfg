#[include fluidd.cfg]
#[include macros.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3C00430006504E5238363120-if00
restart_method: command


[printer]
kinematics: cartesian

max_velocity: 300
max_accel: 3000

max_z_velocity: 5
max_z_accel: 100


#####################################################################
# X
#####################################################################

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14

microsteps: 16
rotation_distance: 40

endstop_pin: ^PC0

position_endstop: 2
#position_min: -10
position_max: 232

homing_speed: 130 #50


[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0

run_current: 0.580
stealthchop_threshold: 999999


#####################################################################
# Y
#####################################################################

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11

microsteps: 16
rotation_distance: 40

endstop_pin: ^PC1

position_endstop: 7
position_min: 7
position_max: 235

homing_speed: 130 #50


[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2

run_current: 0.580
stealthchop_threshold: 999999


#####################################################################
# Z
#####################################################################

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1

microsteps: 16
rotation_distance: 8

endstop_pin: probe:z_virtual_endstop

position_min: -5
position_max: 250

homing_speed: 12 #5
second_homing_speed: 2

homing_retract_dist: 3


[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1

run_current: 0.580
stealthchop_threshold: 999999


#####################################################################
# BLTouch Smart V3.1
#####################################################################

[bltouch]
sensor_pin: ^PC14
control_pin: PA1

# These are STARTING VALUES ONLY.
# Measure your actual probe position.
#x_offset: 0
x_offset: -42
#y_offset: -57
y_offset: 2.3
z_offset: 0.746
speed: 8 #5
lift_speed: 10

probe_with_touch_mode: True
pin_up_touch_mode_reports_triggered: False

samples: 2
sample_retract_dist: 3.0


#####################################################################
# Safe Z Home
#####################################################################

[safe_z_home]
home_xy_position: 159.5, 117.5

speed: 130

z_hop: 10
z_hop_speed: 12


#####################################################################
# Bed Mesh
#####################################################################

[bed_mesh]
speed: 100

horizontal_move_z: 4

mesh_min:    47,12
mesh_max:    190,230
mesh_pps:    2,2
fade_start:  1
fade_end:    10
fade_target: 0



probe_count: 5, 5
algorithm: bicubic


#####################################################################
# Extruder
#####################################################################

[extruder]

step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1

microsteps: 16
rotation_distance: 33.500

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: PC8

sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0

control: pid

# Starting values.
# PID tune your actual hotend.
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982

min_temp: 0
max_temp: 295

min_extrude_temp: 170
max_extrude_only_distance: 100.0

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3

run_current: 0.650
stealthchop_threshold: 999999


#####################################################################
# Heated Bed
#####################################################################

[heater_bed]

heater_pin: PC9

sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4

control: pid

# Starting values.
# PID tune your actual bed.
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182

min_temp: 0
max_temp: 130


#####################################################################
# Part Cooling Fan Fan1
#####################################################################

[fan]
pin: PC6

#####################################################################
# Hotend Cooling Fan0 Runs when extruder is active/hot
#####################################################################

[heater_fan hotend_fan]
pin: PC7
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

#####################################################################
# Hotend Cooling Fan0 Always on
#####################################################################

#[fan_generic hotend_fan]
#pin: PC7  # Use PB15 if wired to FAN2
#max_power: 1.0
#shutdown_speed: 0.0
#cycle_time: 0.010
#hardware_pwm: false
#kick_start_time: 0.100   


#####################################################################
# Electronic Enclosure Fan
#####################################################################

#[controller_fan electronic_enclosure_fan]
